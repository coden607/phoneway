name: AI Vocals & PhoneWay CI

on:
  push:
    branches: [ai-vocals-phoneway]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 TTS ffmpeg-python

      - name: Run voice cloning tests
        run: |
          pytest -q tests/test_voice_clone.py

      - name: Jev risk check
        env:
          JEW_TOKEN: ${{ secrets.JEW_TOKEN }}
        run: |
          cos jev --state "ci-risk-check" --bank "act-gate" --floor 0.72
