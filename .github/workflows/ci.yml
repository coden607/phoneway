name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity / Unit / Python
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:accuracy
      - run: python -m pip install pytest
      - run: pytest -q test_phone_weighing.py

  audit:
    name: Security / Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Browser E2E / Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.1 && npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm run serve > /tmp/phoneweigh.log 2>&1 &
          echo $! > /tmp/phoneweigh.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/phoneweigh.log
          exit 1
      - name: E2E smoke
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror', e => errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          for (const sel of ['#app','#digitDisplay','#btnPower','#btnTare','#btnMode','#btnUnits']) {
            if (!(await page.locator(sel).count())) throw new Error('missing '+sel);
          }
          if (!(await page.locator('#app').evaluate(el=>el.classList.contains('photo-scale-ui')))) throw new Error('gold scale primary UI missing');
          await page.locator('#btnPower').click();
          await page.locator('#btnTare').click();
          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          EOF
      - name: Lighthouse audit
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,pwa --output=json --output-path=/tmp/lh.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/lh.json','utf8'));
          const c=r.categories;
          const gates={accessibility:.90,'best-practices':.90};
          // Performance/PWA are reported for trend visibility; localhost sensor-heavy PWA scores are environment-sensitive.
          for (const [k,min] of Object.entries(gates)) {
            const score=c[k]?.score ?? 0;
            console.log(k, score);
            if (score < min) process.exitCode=1;
          }
          EOF
