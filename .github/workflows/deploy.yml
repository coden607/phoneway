name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Build
        run: |
          echo "Checking project structure..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f manifest.json || (echo "Missing manifest.json" && exit 1)
          test -f sw.js || (echo "Missing sw.js" && exit 1)
          echo "All required files present ✓"

      - name: Clear Vercel linkage
        run: rm -rf .vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@25.1.0 deploy --prod --token "$VERCEL_TOKEN" --cwd ./ --project "$VERCEL_PROJECT_ID" --scope stephens-projects-8fbc16d0

      - name: Notify Success
        if: success()
        run: echo "🚀 Deployed successfully to Vercel!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed. Check Vercel logs."
