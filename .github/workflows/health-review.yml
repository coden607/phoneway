name: Scheduled Health Review

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate health review report
        env:
          REPORT_PATH: health-review.md
          SITE_URL: https://phoneway.vercel.app
        run: node scripts/health-review.mjs
        continue-on-error: true

      - name: Create or update health review issue
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: health-review.md
        with:
          script: |
            const fs = require('node:fs');
            const path = process.env.REPORT_PATH;
            const title = 'Phoneway scheduled health review';
            
            let body = 'Unable to generate health review report.\\n\\nCheck the workflow logs for details.';
            
            try {
              if (fs.existsSync(path)) {
                body = fs.readFileSync(path, 'utf8');
              }
            } catch (error) {
              console.error('Failed to read report:', error);
            }
            
            const { owner, repo } = context.repo;
            
            try {
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              
              const issue = existing.find(item => item.title === title);
              if (issue) {
                console.log(`Updating issue #${issue.number}`);
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body,
                });
              } else {
                console.log('Creating new health review issue');
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ['maintenance', 'scheduled'],
                });
              }
            } catch (error) {
              console.error('Failed to create/update issue:', error);
            }
