name: Scheduled Health Review

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate review report
        env:
          REPORT_PATH: health-review.md
        run: node scripts/health-review.mjs

      - name: Publish maintenance issue
        uses: actions/github-script@v7
        env:
          REPORT_PATH: health-review.md
        with:
          script: |
            const fs = require('node:fs');
            const path = process.env.REPORT_PATH;
            const title = 'Phoneway scheduled health review';
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const issue = existing.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
